   <h1>Join Fitness Zona</h1>

    <p>Create your account and start your fitness journey with us.</p>
    <img src="motivationSP.avif" alt="motivation" width="200">
    <form>

        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name">

        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email">

        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter your password">

        <br><br>

        <label for="confirm-password">Confirm Password:</label>
        <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password">

        <br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob">

        <br><br>
        <img src="bodySP.jpg" alt="body" width="200">
        <label for="gender">Gende>r:</label>

        <select id="gender" name="gender">
            <option value="">Select Gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
        </select>
        <br><br>
<section>
    <h2>Choose Your Fitness Goal</h2>

    <form>
        <label for="goal">What is your main goal?</label>

        <select id="goal" name="goal">
            <option value="">-- Choose a goal --</option>
            <option value="lose-weight">Lose Weight</option>
            <option value="build-muscle">Build Muscle</option>
            <option value="keep-fit">Keep Fit</option>
            <option value="improve-health">Improve Health</option>
        </select>

        <br><br>

        <label for="focus">Choose your focus area:</label>

        <select id="focus" name="focus">
            <option value="">-- Choose an area --</option>
            <option value="full-body">Full Body</option>
            <option value="arms">Arms</option>
            <option value="chest">Chest</option>
            <option value="abs">Abs</option>
            <option value="legs">Legs</option>
        </select>

        <br><br>

        <label for="activity">Your activity level:</label>

        <select id="activity" name="activity">
            <option value="">-- Choose activity level --</option>
            <option value="sedentary">Sedentary</option>
            <option value="lightly-active">Lightly Active</option>
            <option value="moderately-active">Moderately Active</option>
            <option value="very-active">Very Active</option>
        </select>

        <br><br>

        <button type="submit">Get My Fitness Plan</button>
    </form>
</section>
        <label for="profile">Upload Profile Picture:</label>
        <input type="file" id="profile" name="profile">
        <br><br>
        <input type="submit" value="Create Account">
    </form>
</body>
